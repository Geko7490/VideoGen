name: Windows WPF build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build solution
        run: dotnet build "local-ai-video-generator (4)/wpf/LocalAIVideo.sln" --configuration Release

      - name: Publish self-contained Windows app
        run: dotnet publish "local-ai-video-generator (4)/wpf/src/LocalAIVideo/LocalAIVideo.csproj" --configuration Release --runtime win-x64 --self-contained true --output "${{ github.workspace }}/publish/LocalAIVideo"

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIVideo-Windows-x64
          path: publish/LocalAIVideo/
          if-no-files-found: error
